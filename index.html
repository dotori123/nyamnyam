<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4a71a" />
    <meta name="description" content="우리 고양이가 먹은 사료와 습식을 기록하고 다시 찾아보는 앱" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="냥냠냠" />

    <title>냥냠냠 · 고양이 사료 기록장</title>

    <!--
      저장된 고양이 털색 테마를 첫 페인트 전에 적용한다.
      번들이 로드된 뒤에 붙이면 기본 테마(삼색이)가 한 번 번쩍인다.
      키는 src/context/ThemeProvider.tsx의 THEME_STORAGE_KEY와 같아야 한다.
    -->
    <script>
      try {
        var t = localStorage.getItem('nyamnyam.theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>

    <!--
      스플래시.
      번들이 로드되기 전에 크림 배경 + 로고가 먼저 칠해지도록 스타일을 인라인으로 둔다.
      React가 마운트되면 src/main.tsx가 제거한다.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--bg, #faf7f2);
        font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont,
          'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.28s ease;
      }

      #splash.splash--hidden {
        opacity: 0;
        pointer-events: none;
      }

      #splash svg {
        width: 88px;
        height: 88px;
        border-radius: 21px;
        box-shadow: 0 8px 32px rgb(44 44 42 / 12%);
      }

      .splash__name {
        margin: 0;
        color: var(--text, #26261f);
        font-size: 22px;
        font-weight: 800;
      }

      .splash__tagline {
        margin: -8px 0 0;
        color: var(--text-muted, #6f6a5f);
        font-size: 13px;
      }

      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="splash-mark-bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--mark-plate-from, #f4a71a)" />
            <stop offset="1" stop-color="var(--mark-plate-to, #dc8c05)" />
          </linearGradient>
          <clipPath id="splash-mark-head">
            <ellipse cx="50" cy="56" rx="29" ry="26.5" />
          </clipPath>
        </defs>
        <rect width="100" height="100" rx="24" fill="url(#splash-mark-bg)" />
        <g fill="var(--mark-rim, #26261f)">
          <path d="M22.31 43.73 L32.24 12.38 L46.87 32.24 Z" />
          <path d="M77.69 43.73 L67.76 12.38 L53.13 32.24 Z" />
          <ellipse cx="50" cy="56.27" rx="30.31" ry="27.69" />
        </g>
        <path d="M23.5 44 L33 14 L47 33 Z" fill="var(--mark-face, #faf7f2)" />
        <path d="M76.5 44 L67 14 L53 33 Z" fill="var(--mark-face, #faf7f2)" />
        <path d="M31.5 38.5 L34.5 24.5 L41.5 33.5 Z" fill="var(--mark-patch-a, #f4a71a)" />
        <path d="M68.5 38.5 L65.5 24.5 L58.5 33.5 Z" fill="var(--mark-patch-b, #26261f)" />
        <ellipse cx="50" cy="56" rx="29" ry="26.5" fill="var(--mark-face, #faf7f2)" />
        <g clip-path="url(#splash-mark-head)">
          <ellipse cx="33" cy="36" rx="17" ry="12" fill="var(--mark-patch-a, #f4a71a)" />
          <ellipse cx="67" cy="35" rx="15" ry="11" fill="var(--mark-patch-b, #26261f)" />
        </g>
        <ellipse cx="40.5" cy="54" rx="3.7" ry="5" fill="var(--mark-line, #26261f)" />
        <ellipse cx="59.5" cy="54" rx="3.7" ry="5" fill="var(--mark-line, #26261f)" />
        <path d="M50 66 L46.5 61 L53.5 61 Z" fill="var(--mark-nose, #f4a71a)" />
        <path
          d="M41.6 66 a4.4 4.4 0 0 0 8.4 0 a4.4 4.4 0 0 0 8.4 0"
          fill="none"
          stroke="var(--mark-line, #26261f)"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      </svg>
      <p class="splash__name">냥냠냠</p>
      <p class="splash__tagline">Cat food, remembered.</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
